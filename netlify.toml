[build]
  command = "npm run build"
  publish = "dist"

# Proxy para o site da FGF (evita CORS na busca da classificação)
[[redirects]]
  from = "/fgf/*"
  to = "https://fgf.com.br/:splat"
  status = 200
  force = true

# Proxy para a UOL (evita CORS na busca da classificação do Brasileirão)
[[redirects]]
  from = "/uol/*"
  to = "https://www.uol.com.br/:splat"
  status = 200
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
